services:
  web:
    build: .
    container_name: taxmgmt_backend
    restart: always
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    depends_on:
      - redis

  # Runs background jobs (bulk expense import). Migrations are applied by the web container.
  worker:
    build: .
    container_name: taxmgmt_worker
    restart: always
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - .:/app
    entrypoint: ["celery", "-A", "project", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      - redis
      - web

  # Celery broker + import progress cache. Bound to localhost only; nothing needs to persist.
  redis:
    image: redis:7-alpine
    container_name: taxmgmt_redis
    restart: always
    network_mode: "host"
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "${REDIS_PORT:-6379}", "--save", "", "--appendonly", "no"]
